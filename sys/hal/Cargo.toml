[package]
name = "hal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EmiBSD HAL: the hardware and the runtime, the only crate with unsafe (docs/ZERO_UNSAFE.md, section 0)"
publish = false

[lib]
path = "lib.rs"

[features]
# The runtime of the ABI module abi-openbsd.ko (its panic handler, sys/hal/module/rt.rs):
# set by sys/abi/ko alone, never in the kernel's build, which has its own panic handler.
module-rt = []

[dependencies]
libkern.workspace = true

[lints]
workspace = true
