[package]
name = "hal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EmiBSD HAL: the hardware and the runtime, the only crate with unsafe (docs/ZERO_UNSAFE.md, section 0)"
publish = false

[lib]
path = "lib.rs"

[features]
# The runtime of the ABI module abi_openbsd.ko (its panic handler, sys/hal/module/rt.rs):
# set by sys/abi/ko alone, never in the kernel's build, which has its own panic handler.
module-rt = []
# Forwarded by `bsd`'s feature of the same name (sys/Cargo.toml), OpenBSD's option:
diagnostic = []     # `option DIAGNOSTIC` -> the runtime's KASSERT(9)s are active
# No `multiprocessor`: hal is MULTIPROCESSOR code only (decision 40, 2026-10-17); the locks
# always spin for other CPUs, abi_openbsd.ko's runtime included.

[dependencies]
libkern.workspace = true


[lints]
workspace = true
