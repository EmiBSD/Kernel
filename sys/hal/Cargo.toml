[package]
name = "hal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EmiBSD HAL: the hardware and the runtime, the only crate with unsafe (docs/ZERO_UNSAFE.md, section 0)"
publish = false

[lib]
path = "lib.rs"

[features]
# The runtime of the ABI module abi_openbsd.ko (its panic handler, sys/hal/module/rt.rs):
# set by sys/abi/ko alone, never in the kernel's build, which has its own panic handler.
module-rt = []
# Forwarded by `bsd`'s features of the same names (sys/Cargo.toml), OpenBSD's options:
diagnostic = []     # `option DIAGNOSTIC` -> the runtime's KASSERT(9)s are active
multiprocessor = [] # `option MULTIPROCESSOR` -> the locks spin for other CPUs (a default, decision 40)
default = ["multiprocessor"] # the one kernel built (decision 40), abi_openbsd.ko and the host tests too

[dependencies]
libkern.workspace = true


[lints]
workspace = true
