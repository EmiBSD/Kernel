[package]
name = "hal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EmiBSD HAL: the hardware and the runtime, the only crate with unsafe (docs/ZERO_UNSAFE.md, section 0)"
publish = false

[lib]
path = "lib.rs"

[features]
# Forwarded by `bsd`'s feature of the same name (sys/Cargo.toml), OpenBSD's option:
diagnostic = []     # `option DIAGNOSTIC` -> the runtime's KASSERT(9)s are active
# No `multiprocessor`: hal is MULTIPROCESSOR code only (decision 40, 2026-10-17); the locks
# always spin for other CPUs.

[dependencies]
libkern.workspace = true


[lints]
workspace = true
