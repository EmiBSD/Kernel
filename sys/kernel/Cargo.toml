[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EmiBSD kernel: every decision of the operating system, zero unsafe (docs/ZERO_UNSAFE.md, section 0)"
publish = false

[lib]
path = "lib.rs"

[features]
# Forwarded by `bsd`'s features of the same names (sys/Cargo.toml), OpenBSD's options:
diagnostic = ["hal/diagnostic"] # `option DIAGNOSTIC` -> the kernel's KASSERT(9)s are active
debug = []                      # `option DEBUG` -> the kernel's KDASSERT(9)s are active (uvm_pmr_assertvalid)
tmpfs = []                      # `option TMPFS` -> vm::aobj's uao_grow/uao_shrink (tmpfs's regular files)
# No `multiprocessor`: the kernel crate is MULTIPROCESSOR code only (decision 40,
# 2026-10-17): vm::pmemrange always has its per-CPU page caches.
# Host tests only, never a kernel image: `kernel::testutil`, the safe doubles of hal's bridges,
# for the tests of a crate that uses the kernel's pieces (bsd's [dev-dependencies]).
doubles = []

[dependencies]
hal = { path = "../hal" }
libkern.workspace = true
libz.workspace = true
bitflags.workspace = true

# Host microbenchmarks of vm's hot paths over the doubles (decision 42; benches/vm.rs), never
# a kernel image: `cargo bench -p kernel --features doubles --bench vm [--profile dev]`.
[[bench]]
name = "vm"
path = "benches/vm.rs"
harness = false
required-features = ["doubles"]

# Host microbenchmarks of N4.1's hot paths (decision 43; benches/timeout.rs): timeout(9),
# task(9), extent(9) over the doubles, never a kernel image:
# `cargo bench -p kernel --features doubles --bench timeout [--profile dev]`.
[[bench]]
name = "timeout"
path = "benches/timeout.rs"
harness = false
required-features = ["doubles"]

# Host microbenchmarks of N4.2's hot paths (decision 43; benches/proc.rs): the credentials,
# the limit read, the process lists, over the doubles, never a kernel image:
# `cargo bench -p kernel --features doubles --bench proc [--profile dev]`.
[[bench]]
name = "proc"
path = "benches/proc.rs"
harness = false
required-features = ["doubles"]

# Host microbenchmarks of kqueue's and select/poll's hot paths (N4.4, decision 43) over the
# doubles, never a kernel image: `cargo bench -p kernel --features doubles --bench event
# [--profile dev]`.
[[bench]]
name = "event"
path = "benches/event.rs"
harness = false
required-features = ["doubles"]

# Host microbenchmarks of futex(2) (N4.6c, decision 43; benches/futex.rs) over the doubles,
# never a kernel image: `cargo bench -p kernel --features doubles --bench futex
# [--profile dev]`.
[[bench]]
name = "futex"
path = "benches/futex.rs"
harness = false
required-features = ["doubles"]

# Host microbenchmarks of N4.8's clock hot paths (decision 43; benches/clock.rs): the
# timecounter readers and windup over the doubles, never a kernel image:
# `cargo bench -p kernel --features doubles --bench clock [--profile dev]`.
[[bench]]
name = "clock"
path = "benches/clock.rs"
harness = false
required-features = ["doubles"]

[lints]
workspace = true
