[package]
name = "bsd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The OpenBSD kernel, re-implemented in Rust"
build = "build.rs"
publish = false

# No src/: reference/openbsd-src/sys/kern/foo.c <-> sys/kern/foo.rs differ only by extension.
[lib]
path = "lib.rs"

[[bin]]
name = "bsd"
path = "main.rs"
test = false
bench = false
doc = false

# Host microbenchmarks of the legacy timeout(9) adapter's paths (decision 43;
# benches/legacy_timeout.rs) over the kernel crate's doubles, never a kernel image:
# `cargo bench -p bsd --bench legacy_timeout [--profile dev]`.
[[bench]]
name = "legacy_timeout"
path = "benches/legacy_timeout.rs"
harness = false

# Host microbenchmarks of bsd's run and sleep queues (decision 43; benches/legacy_sched.rs)
# over the host machine double and the kernel crate's doubles, never a kernel image:
# `cargo bench -p bsd --bench legacy_sched [--profile dev]`.
[[bench]]
name = "legacy_sched"
path = "benches/legacy_sched.rs"
harness = false

[features]
# `multiprocessor` is always on: the MULTIPROCESSOR kernel is the only one built (decision 40).
default = ["alloc", "boot_config", "multiprocessor", "ffs", "ffs2", "kmemstats", "inet6", "quota", "ufs_dirhash", "mfs", "tmpfs", "msdosfs", "cd9660", "udf", "nfsclient", "nfsserver", "fuse", "ntfs", "ext2fs", "wsdisplay_compat_usl", "wsdisplay_compat_rawkbd"]
alloc = []        # enables `extern crate alloc` and the GlobalAlloc over malloc(9)
boot_config = ["alloc"] # OpenBSD `option BOOT_CONFIG` -> `boot -c`, the UKC> prompt (kern/subr_userconf.c); default (both GENERICs have it)
diagnostic = ["hal/diagnostic", "kernel/diagnostic"]   # OpenBSD `option DIAGNOSTIC` -> kassert! active (and hal's and the kernel crate's)
debug = ["kernel/debug"] # OpenBSD `option DEBUG` -> kdassert! active (and the kernel crate's)
kmemstats = []    # OpenBSD `option KMEMSTATS`  -> malloc(9) statistics; default (GENERIC has it)
pool_debug = []   # OpenBSD `option POOL_DEBUG` -> pool_debug = 1
vmmap_debug = []  # OpenBSD `option VMMAP_DEBUG` -> uvm_tree_sanity, uvm_tree_size_chk, vmspace_validate
ffs = []          # OpenBSD `option FFS`  -> the fast file system (sys/ufs), in vfsconflist[]
ffs2 = ["ffs", "kernel/ffs2"]    # OpenBSD `option FFS2` -> FFS2 (UFS2 dinodes) support in ffs
quota = ["ffs", "kernel/quota"]   # OpenBSD `option QUOTA` -> disk quotas (ufs_quota.c, quotactl(2)); default (GENERIC has it)
ufs_dirhash = ["ffs", "kernel/ufs_dirhash"] # OpenBSD `option UFS_DIRHASH` -> hashed lookups in large directories; default (GENERIC)
mfs = ["ffs", "kernel/mfs"] # OpenBSD `option MFS` -> the memory file system (the kernel's fs::ufs::mfs since N5.5b3), in vfsconflist[]; default (GENERIC)
tmpfs = ["kernel/tmpfs"] # OpenBSD `option TMPFS`   -> tmpfs: the kernel's fs::tmpfs since N5.9t2 (and its vm::aobj's uao_grow/uao_shrink), whose feature this forwards, in vfsconflist[]; default here, commented out in GENERIC (M10c needs it)
msdosfs = ["kernel/msdosfs"] # OpenBSD `option MSDOSFS` -> the MS-DOS FAT file system (the kernel's fs::msdosfs since N5.7c3, whose feature this forwards), in vfsconflist[]
cd9660 = ["kernel/cd9660"] # OpenBSD `option CD9660` -> the ISO 9660 file system: the kernel's fs::isofs::cd9660 since N5.8c2, whose feature this forwards (bsd keeps its label spoof's shell, kern/subr_disk.rs)
udf = ["kernel/udf"] # OpenBSD `option UDF`     -> the UDF file system: the kernel's fs::isofs::udf since N5.8u2, whose feature this forwards (bsd keeps its label spoof's shell, kern/subr_disk.rs)
nfsclient = []    # OpenBSD `option NFSCLIENT` -> the NFS client (sys/nfs), in vfsconflist[]; default (GENERIC)
nfsserver = []    # OpenBSD `option NFSSERVER` -> the NFS server (sys/nfs, nfssvc(2)) and file system exports; default (GENERIC)
ext2fs = ["ffs", "kernel/ext2fs"]  # OpenBSD `option EXT2FS`  -> the second extended file system: the kernel's fs::ufs::ext2fs since N5.6c3 (vfsconflist's "ext2fs", dk_mountroot), on the ufs layer `ffs` compiles
ntfs = []         # OpenBSD `option NTFS`    -> the read-only NTFS file system (sys/ntfs); built where the arch's GENERIC has it (amd64; build.rs emits cfg option_ntfs)
fuse = ["kernel/fuse"] # OpenBSD `option FUSE`    -> FUSE and /dev/fuse0: the kernel's fs::fuse (N5.9f2; vfsconflist[] and arm64's cdevsw[92]/pdevinit name it)
syscall_debug = [] # OpenBSD `option SYSCALL_DEBUG` -> scdebug_call/scdebug_ret print system calls
qemu = []         # QEMU-only exits (isa-debug-exit, semihosting) and shortcuts
encdebug = []     # OpenBSD `option ENCDEBUG` -> the IPsec DPRINTF messages (net.inet.ip.encdebug)
tcp_sack_debug = [] # OpenBSD `option TCP_SACK_DEBUG` -> tcp_print_holes in tcp_output
wdcdebug = []     # OpenBSD `option WDCDEBUG` -> wdc(4)/wd(4) debug messages (WDCDEBUG_PRINT) and the event trace ring (wdcevent.h, wdc_log, ATAIOGETTRACE)
multiprocessor = [] # OpenBSD `option MULTIPROCESSOR` -> the kernel lock, the spinning mutex, the APs (M11a), the TSC sync test (M11b), the audited MP paths (M11e); a default since decision 40 (2026-10-17): the one kernel every recipe, smoke (`smoke-up` on one processor), image and host test builds, as GENERIC.MP; lib.rs refuses a build without it (the uniprocessor branches still in bsd's inherited and adapted modules are not maintained and go when N4 redesigns them; hal, kernel and abi have no such option: they are MULTIPROCESSOR code only)
scsiterse = []    # OpenBSD `option SCSITERSE` -> sense codes printed as numbers, no adesc[] table
miniroot = []     # OpenBSD `option MINIROOTSIZE` -> the ramdisk image compiled in (bsd.rd): rd_root_image/rd_root_size, sized by $EMIBSD_MINIROOTSIZE (sectors), filled by `cargo xtask rdsetroot`; roots on rd0a
inet6 = []        # OpenBSD option INET6 -> IPv6 (sys/netinet6); default (GENERIC has it)
wsemul_dumb = []  # OpenBSD `option WSEMUL_DUMB` -> wsemulconf offers the dumb terminal emulation (dev/wscons/wsemul_dumb.rs, compiled on every build for its host tests)
wsemul_no_vt100 = [] # OpenBSD `option WSEMUL_NO_VT100` -> wsemulconf does not offer the vt100 emulation (compiled on every build for its host tests)
wsdisplay_compat_usl = [] # OpenBSD `option WSDISPLAY_COMPAT_USL` -> wsdisplay(4)'s VT_*/KD* ioctls and process-controlled screen switching (dev/wscons/wsdisplay_compat_usl.rs, compiled on every build); default (both GENERICs have it)
wsdisplay_compat_rawkbd = [] # OpenBSD `option WSDISPLAY_COMPAT_RAWKBD` -> raw scancodes through wsdisplay (WSKBDIO_SETMODE per screen), needed for X11; default (both GENERICs have it)
viocon = []       # amd64 GENERIC's commented-out `#viocon* at virtio?`, uncommented -> viocon(4) in amd64's ioconf.rs and cdevsw 94 (NVIOCON 1); dev/pv/viocon.rs compiles on every build (M16d)

[dependencies]
# The crates of docs/ZERO_UNSAFE.md section 0: bsd calls down into them, never the reverse.
# `abi` is linked into the image (decision 47): bsd's boot glue calls `abi::abi_init` with
# the `KernelApi` it fills (sys/kern/abi_module.rs), until N9's image is kernel + abi + hal.
abi = { path = "abi" }
hal = { path = "hal" }
kernel = { path = "kernel" }
libkern.workspace = true
libz.workspace = true

# The host tests register the kernel crate's doubles of hal's bridges (never the real ones):
# the same dependency with its `doubles` feature, for tests only.
[dev-dependencies]
kernel = { path = "kernel", features = ["doubles"] }
libkern = { workspace = true, features = ["doubles"] }

[lints]
workspace = true
