#
# The unsafe core: the only paths where `unsafe` may live (docs/ZERO_UNSAFE.md, section 4;
# .claude/rules/unsafe-budget.md). Every other module is `forbid` or legacy.
# `cargo xtask unsafe-report` and `cargo xtask lz check` read this file.
#
# A path joins the list only with the user's OK, in a commit of its own, like a budget raise.
# Patterns: an exact file path, or a directory followed by `/**` (everything below it).

[core]
paths = [
    # The hal crate (docs/ZERO_UNSAFE.md section 0, decision 20): the only crate where
    # `unsafe` may live under v2; listed here so the v1 tool counts it as core until the
    # crate groups of unsafe-report v2 (N2.4) replace this file.
    "sys/hal/**",
    # The crate that classifies a trap from userland (decisions 56 and 58): the module whose one
    # item exports the symbol hal's assembly calls, #[unsafe(no_mangle)], its only `unsafe`.
    "sys/entry/arch/arm64/trap.rs",
    # Hardware: MMIO, page tables, traps, context switch, copyin/copyout, atomics.
    "sys/bsd/arch/amd64/**",
    "sys/bsd/arch/arm64/**",
    "sys/bsd/machine/**",
    # Boot: the boot loaders, a separate binary that runs before the kernel, and the kernel
    # binary's boot entry (bsd's `mod stand`).
    "sys/boot/**",
    "sys/bsd/stand/**",
    # Test harness: the host test double; host only.
    "sys/bsd/arch/host/**",
    # Runtime: the primitives every subsystem builds on.
    # Statics.
    "sys/bsd/sys/staticcell.rs",
    # Locks and reference counts.
    "sys/bsd/sys/mutex.rs",
    "sys/bsd/kern/kern_lock.rs",
    "sys/bsd/sys/rwlock.rs",
    "sys/bsd/kern/kern_rwlock.rs",
    "sys/bsd/sys/mplock.rs",
    "sys/bsd/sys/refcnt.rs",
    # Per-CPU data and SMR.
    "sys/bsd/sys/percpu.rs",
    "sys/bsd/kern/subr_percpu.rs",
    "sys/bsd/sys/smr.rs",
    # Allocators.
    "sys/bsd/sys/pool.rs",
    "sys/bsd/kern/subr_pool.rs",
    "sys/bsd/sys/malloc.rs",
    "sys/bsd/kern/kern_malloc.rs",
    # Lists and trees.
    "sys/bsd/sys/queue.rs",
    "sys/bsd/sys/tree.rs",
    "sys/bsd/kern/subr_tree.rs",
    # Copy, print, time.
    "sys/bsd/kern/kern_subr.rs",
    "sys/bsd/kern/subr_prf.rs",
    "sys/bsd/sys/systm.rs",
    "sys/bsd/kern/kern_tc.rs",
]
