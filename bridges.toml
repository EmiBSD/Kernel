#
# The bridges (docs/ZERO_UNSAFE.md section 0.3.2): every trait through which `hal` or
# `kernel` reaches code that has not moved into them yet. The trait is declared by the crate
# that calls it and held in a `OnceStatic<&'static dyn Trait>`; `bsd`'s `main()` registers an
# implementation over its legacy code before first use. A bridge carries no logic of its own.
# N9 requires this file to hold no row.
#
# Schema, one [[bridge]] per trait:
#   trait   = the trait's name, a bare identifier (its crate and module in the comment above the row)
#   for     = the files that call through it
#   paid_by = the milestone whose subsystem moves the implementation in and removes the row
#             ("N3".."N9"; a slice "N4.1" where one is meant)
# The comment above each row says what implements it today.

# bsd: splraise/splx, IPL_MPFLOOR and IPL_HIGH of sys/machine/intr.rs.
# hal::intr::IntrLevel
[[bridge]]
trait = "IntrLevel"
for = ["sys/hal/intr.rs", "sys/hal/mutex.rs"]
paid_by = "N4"

# bsd: cpu_number(), curcpu(), ci_schedstate.spc_spinning, ci_mutex_level (sys/machine/cpu.rs),
# panicstr (sys/kern/subr_prf.rs) and db_active (sys/kern/init_main.rs).
# hal::cpu::CpuId
[[bridge]]
trait = "CpuId"
for = ["sys/hal/cpu.rs", "sys/hal/mutex.rs", "sys/hal/percpu.rs"]
paid_by = "N4"

# bsd: sleep_setup, sleep_finish, tsleep_nsec, wakeup, wakeup_one, curproc and
# _kernel_lock_held of sys/kern/kern_synch.rs, sys/machine/cpu.rs and sys/kern/kern_lock.rs.
# hal::sleep::Sleep
[[bridge]]
trait = "Sleep"
for = ["sys/hal/sleep.rs", "sys/hal/rwlock.rs", "sys/hal/refcnt.rs"]
paid_by = "N4"

# bsd: km_alloc/km_free with &kv_any and &kp_pageable or &kp_zero (sys/uvm/uvm_km.rs). A safe
# trait (decision 30): hal's soundness rests on the boot registration (sys/hal/trust.rs).
# hal::kmbuf::PageMemory
[[bridge]]
trait = "PageMemory"
for = ["sys/hal/kmbuf.rs"]
paid_by = "N3"

# bsd: pool_init/pool_get/pool_put and pr_nout (sys/kern/subr_pool.rs), one pool per TypedPool so
# vmstat -m lists it; safe traits (PoolBackend, RawPool), the same boot contract.
# hal::pool::PoolBackend
[[bridge]]
trait = "PoolBackend"
for = ["sys/hal/pool.rs"]
paid_by = "N9"

# bsd: malloc/free with the C's malloc types (sys/kern/kern_malloc.rs), so vmstat -m counts an
# MBox in its type's row; a safe trait, the same boot contract.

# hal::malloc::Malloc
[[bridge]]
trait = "Malloc"
for = ["sys/hal/malloc.rs"]
paid_by = "N9"

# bsd: copyin, copyout, copyinstr, copyoutstr of sys/machine/copy.rs (copy.S with pcb_onfault).
# A safe trait: it only reads and writes the byte slices it is given.
# hal::user::UserCopy
[[bridge]]
trait = "UserCopy"
for = ["sys/hal/user.rs"]
paid_by = "N4"

# bsd: cnputc, cngetc, cnpollc of sys/dev/cons.rs, registered once consinit() has run.
# hal::cons::Console
[[bridge]]
trait = "Console"
for = ["sys/hal/cons.rs"]
paid_by = "N7"

# bsd: the boot hand-over of abi_openbsd.ko, km_alloc/km_free of its writable copy and, on a
# machine without hal::pmap's module window (arm64 until N3.1 commit 7), km_alloc of its
# range in kernel_map and pmap_enter there (sys/uvm/uvm_km.rs, sys/machine/pmap.rs),
# implemented by sys/kern/abi_module.rs. amd64's window is the loader's own since N3.1
# commit 6 (hal::pmap::module_window/module_enter); reserve/enter go with arm64's window, the
# rest with uvm_km (N3.2) and the boot entry.

# hal::module::ModulePlatform
[[bridge]]
trait = "ModulePlatform"
for = ["sys/hal/module/load.rs"]
paid_by = "N3"

# bsd: one value per pipe inside the pair, its klist and sigio registration (sys/sys/event.rs,
# sys/sys/sigio.rs) with knote_locked, klist_insert_locked/klist_remove_locked/klist_free,
# pgsigio, sigio_free, sigio_setown/getown and getnanotime; implemented by
# sys/kern/pipe_glue.rs (BsdPipeGlue), the pair's generic parameter, not a registered slot.
# kernel::pipe::PipeGlue
[[bridge]]
trait = "PipeGlue"
for = ["sys/kernel/pipe.rs"]
paid_by = "N4"

# bsd: the Uio of a read or write and uiomove (sys/sys/uio.rs, sys/kern/kern_subr.rs), passed
# down by the glue's fo_read/fo_write as &mut dyn UioMove.
# kernel::pipe::UioMove
[[bridge]]
trait = "UioMove"
for = ["sys/kernel/pipe.rs"]
paid_by = "N4"

# bsd: dopipe's descriptor work, falloc/fdinsert/fdrelease/closef under fdplock
# (sys/kern/kern_descrip.rs, sys/sys/filedesc.rs), implemented by sys/kern/pipe_glue.rs.
# kernel::pipe::PipeFiles
[[bridge]]
trait = "PipeFiles"
for = ["sys/kernel/pipe.rs"]
paid_by = "N4"

# bsd: uvm_pagealloc/uvm_pagefree, PHYS_TO_VM_PAGE(pa)->mdpage, uvm_page_physsteal and
# uvm.page_init_done (sys/uvm/uvm_page.rs), implemented by sys/machine/pmap.rs (BsdPages)
# and passed to hal::pmap::bootstrap as a value, not a registered slot (D16). Paid by N3.3,
# when kernel::vm implements it: the row goes, the trait stays as API (0.3.2).
# hal::pmap::PhysPages
[[bridge]]
trait = "PhysPages"
for = ["sys/hal/pmap.rs"]
paid_by = "N3"

# bsd: CPU_INFO_FOREACH, cpu_is_running, ci_proc_pmap, ci_cflushsz, x86_fast_ipi with
# LAPIC_IPI_INVLPG/INVLRANGE/INVLTLB and wbinvd_on_all_cpus (sys/arch/amd64/amd64/{cpu,ipi}.rs),
# for amd64's TLB shootdown and cache flush, implemented by sys/kern/hal_bridges.rs
# (BsdTlbCpus); arm64 broadcasts tlbi and registers none.
# hal::pmap::TlbCpus
[[bridge]]
trait = "TlbCpus"
for = ["sys/hal/arch/amd64/pmap/tlb.rs", "sys/hal/arch/amd64/pmap/backend.rs"]
paid_by = "N4"


# bsd: arc4random (sys/dev/rnd.rs), for arm64's ASID allocator (pmap_find_asid's random pick),
# implemented by sys/kern/hal_bridges.rs (BsdRandom).
# hal::pmap::Random
[[bridge]]
trait = "Random"
for = ["sys/hal/arch/arm64/pmap/asid.rs"]
paid_by = "N7"
