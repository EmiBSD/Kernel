#
# The bridges (docs/ZERO_UNSAFE.md section 0.3.2): every trait through which `hal` or
# `kernel` reaches code that has not moved into them yet. The trait is declared by the crate
# that calls it and held in a `OnceStatic<&'static dyn Trait>`; `bsd`'s `main()` registers an
# implementation over its legacy code before first use. A bridge carries no logic of its own.
# A trait a crate receives as a value (`hal::pmap::PhysPages`, `kernel::pipe::PipeGlue`) is a
# row only while `bsd` implements it; the row goes when a `kernel` module does, and the trait
# stays as API (decision 39). N9 requires this file to hold no row.
#
# Schema, one [[bridge]] per trait:
#   trait   = the trait's name, a bare identifier (its crate and module in the comment above the row)
#   for     = the files that call through it
#   paid_by = the milestone whose subsystem moves the implementation in and removes the row
#             ("N3".."N9"; a slice "N4.1" where one is meant)
# The comment above each row says what implements it today.

# bsd: the interrupt controller's part of spl(9) (struct arm_intr_func: raise, lower, x, setipl,
# and arm_splassert_check), implemented by sys/arch/arm64/arm64/intr.rs (ArmIntrHardware, over
# the table the GIC drivers give arm_set_intr_handler) and registered by arm64's initarm (N4.5c,
# replacing IntrLevel: the level itself is hal's). Decision 46: the C's function table as a
# trait. N4.8b: dispatch_irq and dispatch_fiq (arm_irq_dispatch, arm_fiq_dispatch), which
# hal's arm_cpu_irq/arm_cpu_fiq call. Paid when the GIC drivers move (N7).
# hal::intr::IntrHardware
[[bridge]]
trait = "IntrHardware"
for = ["sys/hal/intr.rs"]
paid_by = "N7"

# bsd: pool_init/pool_get/pool_put, pr_nout, pool_sethiwat and pool_cache_init (RawPool's
# set_hiwat/cache_init, N3.4a: uvm_anon_init, amap_init) of sys/kern/subr_pool.rs, one pool per
# TypedPool so vmstat -m lists it; safe traits (PoolBackend, RawPool), the same boot contract.
# hal::pool::PoolBackend
[[bridge]]
trait = "PoolBackend"
for = ["sys/hal/pool.rs"]
paid_by = "N9"

# bsd: malloc/free with the C's malloc types (sys/kern/kern_malloc.rs), so vmstat -m counts an
# MBox in its type's row; a safe trait, the same boot contract. N4.6b: nkmempages (vm.nkmempages,
# the VmSysctl bridge's member that moved here).

# hal::malloc::Malloc
[[bridge]]
trait = "Malloc"
for = ["sys/hal/malloc.rs"]
paid_by = "N9"



# bsd: the machine's per-CPU hooks a trap calls (N4.8b): ci_flush_bp (cpu.c's choice, which
# PSCI's psci_flush_bp rewrites on its first call), ci_serror (Apple's report) and fault()'s
# claim of ci_panicbuf, implemented by sys/arch/arm64/arm64/cpu.rs (ArmCpuHooks) over the
# running CPU's cpu_info and registered by arm64's initarm. Paid when the CPU and PSCI drivers
# move (N7).
# hal::trap::CpuHooks
[[bridge]]
trait = "CpuHooks"
for = ["sys/hal/trap.rs", "sys/hal/arch/arm64/trap.rs"]
paid_by = "N7"

# bsd: ddb's db_ktrap (sys/arch/arm64/arm64/db_interface.rs, DdbDebugger), the kernel
# debugger's entry from a trap (N4.8b), registered by arm64's initarm; absent, a kernel
# breakpoint panics as the C without DDB. Paid with ddb (N9).
# hal::trap::Debugger
[[bridge]]
trait = "Debugger"
for = ["sys/hal/trap.rs", "sys/hal/arch/arm64/trap.rs"]
paid_by = "N9"

# bsd: cnputc, cngetc, cnpollc of sys/dev/cons.rs, registered once consinit() has run.
# hal::cons::Console
[[bridge]]
trait = "Console"
for = ["sys/hal/cons.rs"]
paid_by = "N7"

# bsd: printf of sys/kern/subr_prf.rs (the console and the message buffer, under printf's lock),
# and its log(9) (N4.7b: kernel::pty's tablefull; N4.8a: kernel::tc's clock-step line),
# implemented by sys/kern/hal_bridges.rs (BsdPrintf) and registered before main(); the kernel
# crate's lines (kernel::prf: unported!, vm::page, vm::pmemrange, vm::km) go through it.
# subr_prf goes with the bsd crate.
# hal::prf::Printf
[[bridge]]
trait = "Printf"
for = ["sys/hal/prf.rs"]
paid_by = "N9"

# bsd: the boot hand-over of abi_openbsd.ko (IMAGE_VA/IMAGE_LEN from stand::start_kernel),
# implemented by sys/kern/abi_module.rs. The trait keeps only image since N3.2: the mapping is
# the loader's own on both machines (hal::pmap::module_window/module_enter, N3.1 commits 6 and
# 7) and the writable copy's memory is the kernel's (kernel::vm::km::module_memory(), a
# hal::module::ModuleMemory passed to load as a value). N4.1, the boot entry.
# hal::module::ModulePlatform
# Re-dated N9 at the N4 close (the user, 2026-10-24): the module's boot entry goes with bsd's main().
[[bridge]]
trait = "ModulePlatform"
for = ["sys/hal/module/load.rs"]
paid_by = "N9"


# bsd: BUFPAGES_DEFICIT and BUFPAGES_INACT of sys/sys/mount.rs over bcstats (sys/kern/vfs_bio.rs),
# implemented by sys/kern/vm_bsd.rs (BsdBufCacheStats) and registered by its uvm_page_init;
# 0 before registration (their boot values). N5, with the buffer cache.
# kernel::vm::pmemrange::BufCacheStats
[[bridge]]
trait = "BufCacheStats"
for = ["sys/kernel/vm/pmemrange.rs"]
paid_by = "N5"

# bsd: getnanotime and the three pipe filterops (which find the pair through the knote's
# file); implemented by sys/kern/pipe_glue.rs (BsdPipeGlue), the pair's generic parameter, not
# a registered slot. N4.4: the klist is the kernel's, by value in each pipe
# (kernel::event::Klist, Own kind): Knote, knote, klist_insert, klist_remove and klist_free
# left the trait. N4.5b: the sigio registration is the kernel's too (kernel::sigio::SigioRef in
# each pipe): new, pgsigio, sigio_free, sigio_setown and sigio_getown left the trait, and the
# glue holds nothing per pipe. What stays goes with the clock (N4.8).
# kernel::pipe::PipeGlue
# Re-dated N5 at the N4 close (the user, 2026-10-24): what it calls is the kernel's since N4 (kernel::tc, kernel::reboot, kernel::proc, kernel::file); N5's first slice wires it and removes the row.
[[bridge]]
trait = "PipeGlue"
for = ["sys/kernel/pipe.rs"]
paid_by = "N5"

# bsd: uiomove over a Uio (sys/kern/kern_subr.rs; the Uio itself is kernel::uio's since
# N4.3, bsd's alias in sys/sys/uio.rs), passed down by the glue's fo_read/fo_write as
# &mut dyn UioMove; N3.5 S1: uio_rw (is_write) for uvm_io (kern.proc_args). N4.3: paid by
# N7, with the last UIO_SYSSPACE builder (uiomove's kernel-address leg copies to an
# address its builder vouched for, which no safe hal function may do; VFS, net, the
# drivers and crypto type theirs in their slices). N4.7b: set_resid (ttwrite's give-back of
# what it copied in but did not queue) for the terminal's read and write paths.
# kernel::uio::UioMove (re-exported by kernel::pipe)
[[bridge]]
trait = "UioMove"
for = ["sys/kernel/pipe.rs", "sys/kernel/vm/io.rs", "sys/kernel/tty.rs"]
paid_by = "N7"

# bsd: what a file is open on and the calls the descriptors make into the subsystems still in
# bsd (sys/kern/kern_descrip.rs, BsdFileGlue, the glue kernel::file and kernel::descrip are
# instantiated with: the objects (vnode, socket, pipe, kqueue), struct fileops, the vnode
# layer's VOP_ADVLOCK/VOP_PATHCONF/VISTTY and the positioned-I/O checks (N5), SS_DNS (N6),
# SIGPIPE (N4.5), the stall wait (N5), pledge's fcntl/flock/ioctl hooks (N8, the last),
# maxfiles and tablefull). N4.4: knote_fdclose, fdkq_free and the Knote/FdKq types left (kqueue
# is kernel::event's); a kqueue file's fileops and object (kqueue_file, kqueue_of) and a vnode
# file's revocation (vnode_revoked, N5) came. N4.6b: getcwd (kern.proc_cwd's
# vfs_getcwd_common, N5).
# kernel::file::FileGlue
[[bridge]]
trait = "FileGlue"
for = ["sys/kernel/file.rs", "sys/kernel/descrip.rs", "sys/kernel/event.rs"]
paid_by = "N8"

# bsd: dopipe's descriptor work, falloc/fdinsert/fdrelease/closef under fdplock
# (sys/kern/kern_descrip.rs, sys/sys/filedesc.rs), implemented by sys/kern/pipe_glue.rs.
# kernel::pipe::PipeFiles
# Re-dated N5 at the N4 close (the user, 2026-10-24): what it calls is the kernel's since N4 (kernel::tc, kernel::reboot, kernel::proc, kernel::file); N5's first slice wires it and removes the row.
[[bridge]]
trait = "PipeFiles"
for = ["sys/kernel/pipe.rs"]
paid_by = "N5"

# bsd: CPU_INFO_FOREACH, cpu_is_running, ci_proc_pmap, ci_cflushsz, x86_fast_ipi with
# LAPIC_IPI_INVLPG/INVLRANGE/INVLTLB and wbinvd_on_all_cpus (sys/arch/amd64/amd64/{cpu,ipi}.rs),
# for amd64's TLB shootdown and cache flush, implemented by sys/kern/hal_bridges.rs
# (BsdTlbCpus); arm64 broadcasts tlbi and registers none. Re-dated N10 by the user's decision
# 11 of N4.6 (N4.5's decision 8: amd64 is frozen until N10, decision 44); paid_by stays N4
# until xtask's schema accepts N10 (it takes N2..N9).
# hal::pmap::TlbCpus
# Re-dated N10 at the N4 close (the user, 2026-10-24; decision 11 of N4.6): amd64's, frozen until N10 (decision 44); bridges.rs accepts N10 since.
[[bridge]]
trait = "TlbCpus"
for = ["sys/hal/arch/amd64/pmap/tlb.rs", "sys/hal/arch/amd64/pmap/backend.rs"]
paid_by = "N10"

# bsd: arc4random (sys/dev/rnd.rs), for arm64's ASID allocator (pmap_find_asid's random pick)
# and, N3.5 S1, hal::random's arc4random/arc4random_uniform (the kernel map's randomisation),
# implemented by sys/kern/hal_bridges.rs (BsdRandom). N4.7b: enqueue_randomness (the terminal's
# every input character, tty.c's ttyinput), hal::random::enqueue_randomness; N4.8a: kernel::tc's
# (the new counter's first readings, the clock steps).
# hal::pmap::Random
[[bridge]]
trait = "Random"
for = ["sys/hal/arch/arm64/pmap/asid.rs", "sys/hal/random.rs"]
paid_by = "N7"

# bsd: the accounting file (sys/kern/proc_glue.rs's BsdAcctFile: vn_open of a regular file with
# UNVEIL_WRITE, and its BsdAcctSink: vn_rdwr of a record, VFS_STATFS, the VBAD check,
# vn_close), for kernel::acct (N4.6a); registered by hal_bridges_register. N5, with the vnodes.
# kernel::acct::AcctFile
[[bridge]]
trait = "AcctFile"
for = ["sys/kernel/acct.rs"]
paid_by = "N5"


# bsd: the machine's clock hardware (crate::machine::cpu's cpu_initclocks, cpu_startclock,
# setstatclockrate, delay; arm64's arm_clock_func in intr.rs, first registration winning),
# implemented by sys/kern/hal_bridges.rs (BsdClockHardware), for kernel::clock's initclocks.
# N7, with the clock drivers.
# kernel::clock::ClockHardware
[[bridge]]
trait = "ClockHardware"
for = ["sys/kernel/clock.rs"]
paid_by = "N7"

# bsd: the machine's boot(9) (machdep's: vfs_shutdown, config_suspend_all, the halt or reset),
# implemented by sys/kern/hal_bridges.rs (BsdMachineBoot), for kernel::reboot::reboot. N7.
# kernel::reboot::MachineBoot
[[bridge]]
trait = "MachineBoot"
for = ["sys/kernel/reboot.rs"]
paid_by = "N7"

# bsd: the time-of-day chips (struct todr_chip_handle of efi_machdep.rs and plrtc.rs on arm64),
# implemented by sys/dev/clock_subr.rs (TodrChipHandle), received by kernel::time::todr_attach.
# N7, with the drivers.
# kernel::time::Todr
[[bridge]]
trait = "Todr"
for = ["sys/kernel/time.rs"]
paid_by = "N7"

# bsd: the hardware timecounters: agtimer(4)'s AgtimerTc (sys/arch/arm64/dev/agtimer.rs) and
# the drivers' struct timecounter (sys/sys/timetc.rs: acpitimer, acpihpet), received by
# kernel::tc::tc_init through their TcEntry. N7, with the drivers.
# kernel::tc::Timecounter
[[bridge]]
trait = "Timecounter"
for = ["sys/kernel/tc.rs"]
paid_by = "N7"

# bsd: each CPU's interrupt clock, agtimer(4)'s AgtimerIntrclock (sys/arch/arm64/dev/agtimer.rs),
# received by kernel::clockintr::clockintr_cpu_init. N7, with the driver.
# kernel::clockintr::Intrclock
[[bridge]]
trait = "Intrclock"
for = ["sys/kernel/clockintr.rs"]
paid_by = "N7"

# bsd: NET_LOCK, NET_UNLOCK and rw_status(&netlock) == RW_WRITE (sys/net/if.rs), for the vnode
# pager's uvn_io, which lets go of the net lock a faulting process holds around the VOP (N3.4c);
# implemented by sys/kern/hal_bridges.rs (BsdNetLock) and registered by bsd's uvm_init (N3.4e);
# nobody holds it before registration. N6, with the network stack.
# hal::netlock::NetLock
[[bridge]]
trait = "NetLock"
for = ["sys/hal/netlock.rs", "sys/kernel/vm/vnode.rs"]
paid_by = "N6"

# bsd: getmicrouptime (sys/kern/kern_tc.rs, for the vnode pager's own ratecheck), rebooting and
# &rebooting (sys/kern/kern_xxx.rs); implemented by sys/kern/vm_bsd.rs (BsdSysInfo) and
# installed by bsd's uvm_init (N3.4e); (0, 0) and false before. N4, with kern_time and kern_xxx.
# kernel::vm::vnode::SysInfo
# Re-dated N5 at the N4 close (the user, 2026-10-24): what it calls is the kernel's since N4 (kernel::tc, kernel::reboot, kernel::proc, kernel::file); N5's first slice wires it and removes the row.
[[bridge]]
trait = "SysInfo"
for = ["sys/kernel/vm/vnode.rs", "sys/kernel/vm/map.rs"]
paid_by = "N5"

# bsd: struct vnode (v_uvm, v_type == VBLK, VTEXT, v_mount, vref, vrele, vget(LK_NOWAIT),
# vn_lock, VOP_UNLOCK, VOP_GETATTR, VOP_READ and VOP_WRITE over a UIO_SYSSPACE uio with
# curproc's credentials: sys/sys/vnode.rs, sys/kern/vfs_subr.rs, vfs_vnops.rs, vfs_vops.rs),
# implemented by bsd's Vnode (sys/kern/vm_bsd.rs since N3.5) and passed as &'static dyn VnodeOps to
# uvn_attach and the uvm_vnp_* functions (vnodes are never freed); kept by the Uvn. N5, with
# the vnode layer. N3.5 S1: mmap(2)'s v_type, iszerodev(v_rdev) and VOP_GETATTR's va_flags.
# kernel::vm::vnode::VnodeOps
[[bridge]]
trait = "VnodeOps"
for = ["sys/kernel/vm/vnode.rs", "sys/kernel/vm/mmap.rs"]
paid_by = "N5"


# bsd: curproc's facts as uvm asks them (pledge_protexec, the W^X exemption and ps_wxcounter,
# sigexit, trapsignal, ps_pid/p_tid/ps_comm/PROC_PC, ps_acflag, lim_cur, P_HASSIBLING,
# ps_strings/ps_sigcode/ps_timekeep, fd_getfile..FRELE of a vnode, ps_kbind_* under ps_mtx,
# ps_libcpin, p_ru's faults and maxrss, log(9), uprintf(9) since N4.8b); implemented by
# sys/kern/vm_bsd.rs (N3.5 S1,
# registered by bsd's uvm_init at the flip), one bsd call each. N4, when Proc moves.
# kernel::vm::proc::VmProc
# Re-dated N5 at the N4 close (the user, 2026-10-24): what it calls is the kernel's since N4 (kernel::tc, kernel::reboot, kernel::proc, kernel::file); N5's first slice wires it and removes the row.
[[bridge]]
trait = "VmProc"
for = ["sys/kernel/vm/proc.rs", "sys/kernel/vm/map.rs", "sys/kernel/vm/mmap.rs", "sys/kernel/vm/unix.rs", "sys/kernel/vm/meter.rs"]
paid_by = "N5"

# bsd: the sysctl(2) nodes of the subsystems still in bsd, registered by id with
# kernel::sysctl's dispatcher by sys/kern/kern_sysctl.rs's sysctl_register_legacy (from
# hal_bridges_register, N4.6b): the net (N6), vfs (N5), machdep (with arm64's machdep; amd64's
# at N10) and ddb (N9) trees; kern.ostype/osrelease/osversion/version (conf/vers, N9.1),
# kern.clockrate, kern.boottime, kern.cp_time, kern.cp_time2, kern.cpustats, kern.timecounter,
# kern.clockintr and kern.utc_offset (N4.8a), kern.tty (N4.7b), kern.numvnodes, kern.nchstats,
# kern.bufcachepercent (N5), kern.maxclusters, kern.mbstat, kern.file (N6, its socket half;
# its vnode half N5), kern.pfstatus (N8), kern.stackgap_random (N8.4), kern.consdev,
# kern.intrcnt, kern.evcount, kern.watchdog, kern.audio, hw.sensors, hw.ucomnames, hw.machine,
# hw.smt, hw.blockcpu (N7), kern.malloc, kern.pool, kern.pool_debug (N9); and the bounded
# integers of kern_vars[]/hw_vars[] whose variables are bsd's (maxvnodes, maxproc, maxfiles,
# nfiles, ttycount, maxthread, somaxconn, sominconn, nosuidcoredump, fscale, splassert,
# maxlocksperuid, autoconf_serial, ncpu, ncpufound, diskcount) and physmem's variable. Each
# registration leaves with its subsystem; N9 the last. Decision 46: the C's sysctlfn dispatch
# as one trait.
# kernel::sysctl::SysctlNode
[[bridge]]
trait = "SysctlNode"
for = ["sys/kernel/sysctl.rs"]
paid_by = "N9"

# bsd: the disk list as sysctl_diskinit reads it (sys/kern/subr_disk.rs's disklist,
# disk_count and disk_change, each disk's name, label uid and struct diskstats under its
# dk_mtx), implemented by sys/kern/kern_sysctl.rs (BsdDiskExport) and installed by
# sysctl_register_legacy (N4.6b), for hw.disknames and hw.diskstats. N7, with the disks.
# kernel::sysctl::DiskExport
[[bridge]]
trait = "DiskExport"
for = ["sys/kernel/sysctl.rs"]
paid_by = "N7"

# bsd: the console's half of the device switch that sendsyslog(2) writes through when no
# syslogd(8) socket is set (dosendsyslog's KERNEL_LOCK leg): cnwrite and its test `constty ||
# cn_devvp` (dev/cons.c), implemented by sys/kern/subr_log.rs (BsdTtyDevsw, over dev/cons.rs's
# cnwrite, constty and cn_devvp_set) and registered by bsd's initconsbuf (N4.7a). N4.7b moves it
# to kernel::tty and adds the tty's legs: d_stop (cdevsw[major(t_dev)].d_stop), TIOCCONS's
# /dev/console access check (namei + VOP_ACCESS, VFS) and s_ttyvp (TIOCSCTTY's vnode test, N5);
# d_tty and the pty master test stay in bsd's cdevsw adapters (they call the kernel with the tty
# and the side). Paid when the console and the device switch move (N7, decision 45's CharDevice).
# kernel::tty::TtyDevsw
[[bridge]]
trait = "TtyDevsw"
for = ["sys/kernel/log.rs", "sys/kernel/tty.rs"]
paid_by = "N7"

# bsd: the members of bsd's subsystems a process, thread, group and session carry (sigacts,
# the descriptor tables, the kqueues, the timeouts, the unveil table, the klist and its mutex,
# the run-queue link), the tables' storage, and the hooks into kern_sig (pgsignal, prsignal),
# tty (a session's hang-up; a group's terminal until N4.7b, when pgdelete calls
# kernel::tty::pgrp_gone and s_ttyp became the kernel Session's) and kern_timeout
# (s_verauthto); implemented by
# sys/kern/proc_glue.rs (BsdProcGlue, N4.2), which kernel::proc receives as its type
# parameter. N4.4: the knote and kqueue list adapters (proc_glue_links!), with_curproc
# (bsd's reads hal::thread's curproc since N4.5a),
# pledge_fail (N4.7) and process_ref (filt_procattach's counted process); the klist store
# left (ps_klist is the kernel's). N4.5a: the scheduler's hooks (kernel::sched):
# cold and cold_yield, tuagg_add_runtime and
# exit_account (kern_resource), the clock interrupts' stop and start (kern_clockintr,
# spc_runtime), assertwaitok, smr_idle, spl0, the machine's idle cycle, cpu_unidle and
# need_resched, the CPU topology and pmap_resident_count; the scheduler's hal::sleep::Sleep is
# kernel::sched::KernelSleep (the Sleep row is gone, decision 39). N4.5b: the signals are
# kernel::sig's (sleep_signal_check is kernel::sched's, pgsignal and prsignal left the trait);
# their calls out: coredump (the file systems, N5), and the machine's sendsig, signotify,
# PROC_STACK and TCB_GET (N4.8). N4.6a: exit1 and initprocess's address left the trait (the
# kernel's own: kernel::exit, ProcTables::initprocess); the process code's calls out joined
# it: maxprocess and maxthread (conf/param), log(9), thread_placed (bsd's &'static of a new
# thread, N4.8), process_initialized (ps_realit_to, N4.8a), process_forked and textvp_release
# (the text vnode, N5; the unveils, N8), session_has_tty_vnode and session_ttydev (N4.7b),
# pmap_activate, pmap_deactivate, pmap_purge, child_return, tcb_invalid and tcb_set (the
# machine, N4.8/N10), start_init (N9.1), init_exited (the QEMU exit), cancel_all_itimers
# (N4.8a), unveil_destroy (N8), rtable_exists (N6) and pgrp_ref. N4.8b: the system call
# prologue's calls out joined it (kernel::syscall): proc_pc and sigcode_svc_offset (the
# machine, N4.8b's b3 or N10), user_vmspace (the thread's word, until its [o] members are
# typed), pledge_syscall (kern_pledge, N8) and scdebug_call/scdebug_ret (SYSCALL_DEBUG,
# kern_xxx); hal::trap::TrapHandler is kernel::syscall's own (KernelTrap), no row. N4.8b b3:
# sendsig, signotify, proc_stack and proc_pc left the trait (hal::sig's frame, kernel::sig's
# signotify over hal::thread's aston and cpu_unidle, hal::trap::proc_pc/proc_stack); b3c:
# tcb_get, tcb_set and tcb_invalid left it (hal::thread). Re-dated N8 (the user's
# decision 11 of N4.6): its members reach N5 and N8. N4.6b: sysctl's calls out joined it:
# pledge_sysctl (N8), session_tty (s_ttyp's t_dev, t_pgrp and t_session, N4.7b), unveil_state
# (ps_uvpaths, ps_uvdone, N8) and cpu_unit (CPU_INFO_UNIT, the machine).
# kernel::proc::ProcGlue
[[bridge]]
trait = "ProcGlue"
for = ["sys/kernel/proc.rs", "sys/kernel/event.rs", "sys/kernel/sched.rs", "sys/kernel/sig.rs", "sys/kernel/fork.rs", "sys/kernel/exit.rs", "sys/kernel/acct.rs", "sys/kernel/prot.rs", "sys/kernel/resource.rs"]
paid_by = "N8"
