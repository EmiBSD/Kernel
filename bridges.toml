# kernel::tc::Timecounter
[[bridge]]
trait = "Timecounter"
for = ["sys/kernel/tc.rs"]
paid_by = "N7"

# bsd: each CPU's interrupt clock, agtimer(4)'s AgtimerIntrclock (sys/arch/arm64/dev/agtimer.rs),
# received by kernel::clockintr::clockintr_cpu_init. N7, with the driver.
# kernel::clockintr::Intrclock
[[bridge]]
trait = "Intrclock"
for = ["sys/kernel/clockintr.rs"]
paid_by = "N7"

# bsd: NET_LOCK, NET_UNLOCK and rw_status(&netlock) == RW_WRITE (sys/net/if.rs), for the vnode
# pager's uvn_io, which lets go of the net lock a faulting process holds around the VOP (N3.4c);
# implemented by sys/kern/hal_bridges.rs (BsdNetLock) and registered by bsd's uvm_init (N3.4e);
# nobody holds it before registration. N6, with the network stack.
# hal::netlock::NetLock
[[bridge]]
trait = "NetLock"
for = ["sys/hal/netlock.rs", "sys/kernel/vm/vnode.rs"]
paid_by = "N6"

# bsd: struct inode_vtbl, the inode operations FFS gives the UFS layer (ffs_vtbl: truncate,
# update, inode_alloc, inode_free, buf_alloc, bufatoff), implemented by sys/ufs/ffs/ffs_vfsops.rs
# (FfsVtbl over ffs_truncate, ffs_update, ffs_inode_alloc, ffs_inode_free, ffs_balloc,
# ffs_bufatoff; its buffers lent, IoBuf::Lent) and held by each FFS inode (Inode::vtbl, N5.5a1;
# ext2fs's inodes hold none, as the C's). Decision 46: the C's table as a trait, which stays as
# API when ffs moves. Called through bsd's UFS_* functions (sys/ufs/ufs/inode.rs) at N5.5a1;
# the kernel's ufs_inactive, ufs_reclaim and dirhash (N5.5a2: truncate, update, inode_free,
# bufatoff, the last as the busy buffer's token) and lookup and vnode operations (N5.5a3:
# all six, bufatoff and buf_alloc as tokens; ffs_bufatoff's lent twin went with bsd's
# lookup) join. Paid when ffs moves (N5.5b).
# kernel::fs::ufs::ufs::inode::InodeOps
[[bridge]]
trait = "InodeOps"
for = ["sys/kernel/fs/ufs/ufs/ufs_dirhash.rs", "sys/kernel/fs/ufs/ufs/ufs_inode.rs", "sys/kernel/fs/ufs/ufs/ufs_lookup.rs", "sys/kernel/fs/ufs/ufs/ufs_vnops.rs", "sys/ufs/ufs/inode.rs"]
paid_by = "N5"

# bsd: the three slots of ffs_vops/ffs_specvops that are ffs's own (ffs_read, ffs_write,
# ffs_fsync; ffs_vnops.c:60-134), implemented on ffs's FfsVtbl by sys/ufs/ffs/ffs_vnops.rs
# (each packs its struct vop_*_args) and held by the kernel's composed tables UfsVnops and
# UfsSpecVnops (bsd's FFS_VOPS and FFS_SPECVOPS statics, N5.5a3). Decision 46's written
# reason: not a C table but the residue of one (the rest of ffs_vops is the UFS layer's), so
# a sub-trait beside InodeOps rather than a re-declared Vnops; the kernel's ffs implements it
# and the row goes when ffs moves (N5.5b).
# kernel::fs::ufs::ufs::ufs_vnops::UfsFs
[[bridge]]
trait = "UfsFs"
for = ["sys/kernel/fs/ufs/ufs/ufs_vnops.rs"]
paid_by = "N5"

# bsd: struct vops, the operations table of each bsd file system (mfs, ext2fs, cd9660,
# msdosfs, udf, tmpfs, fuse, nfs, ntfs and their special-file tables: 23 statics of
# Option<fn(&mut VopXxxArgs)> slots), implemented on bsd's Vops by sys/kern/vfs_vops.rs (each
# method packs the slot's struct vop_*_args; a NULL slot answers EOPNOTSUPP) and registered by
# address on a table's first getnewvnode (VopsId), dispatched by every vop_* of
# kernel::fs::vops (N5.2). ffs's vnode table is the kernel's UfsVnops (and UfsSpecVnops)
# since N5.5a3: bsd's FFS_VOPS and FFS_SPECVOPS are statics of them, not Vops. Paid when the
# last bsd file system moves: N5.5 to N5.9, nfs at N6, ntfs at N10 (the user's N5 scope
# decision of 2026-10-28), so N10.
# kernel::fs::vops::Vnops
[[bridge]]
trait = "Vnops"
for = ["sys/kernel/fs/vops.rs", "sys/kernel/fs/vnode.rs", "sys/kernel/fs/subr.rs"]
paid_by = "N10"

# bsd: struct vfsops, the operations of each bsd file system type (vfsconflist[]'s entries,
# kern/vfs_init.rs), implemented on bsd's Vfsops by sys/kern/vfs_vops.rs and held by the
# kernel's Vfsconf (N5.2); vfs_checkexp (the NFS server's) stays bsd's, reached through
# as_any. ffs's vnode table is the kernel's UfsVnops since N5.5a3, its vfsops still bsd's
# (N5.5b). Paid with Vnops, when the last bsd file system moves (nfs at N6, ntfs at N10), so
# N10.
# kernel::fs::vops::Vfs
[[bridge]]
trait = "Vfs"
for = ["sys/kernel/fs/vops.rs", "sys/kernel/fs/mount.rs", "sys/kernel/fs/init.rs"]
paid_by = "N10"

# bsd: the device switch as the special files call it (cdevsw[]/bdevsw[] of machine::conf,
# nchrdev, nblkdev, chrtoblk, iskmemdev, iszerodev), implemented by sys/sys/specdev.rs
# (BsdDevsw) and registered by hal_bridges_register (N5.2). Paid when the device switch moves
# (N7.2, decision 45's CharDevice).
# kernel::fs::spec::Devsw
[[bridge]]
trait = "Devsw"
for = ["sys/kernel/fs/spec.rs", "sys/kernel/fs/subr.rs"]
paid_by = "N7"

# bsd: the sysctl(2) nodes of the subsystems still in bsd, registered by id with
# kernel::sysctl's dispatcher by sys/kern/kern_sysctl.rs's sysctl_register_legacy (from
# hal_bridges_register, N4.6b): the net (N6), vfs (N5), machdep (with arm64's machdep; amd64's
# at N10) and ddb (N9) trees; kern.ostype/osrelease/osversion/version (conf/vers, N9.1),
# kern.clockrate, kern.boottime, kern.cp_time, kern.cp_time2, kern.cpustats, kern.timecounter,
# kern.clockintr and kern.utc_offset (N4.8a), kern.tty (N4.7b), kern.numvnodes, kern.nchstats,
# kern.bufcachepercent (N5), kern.maxclusters, kern.mbstat, kern.file (N6, its socket half;
# its vnode half N5), kern.pfstatus (N8), kern.stackgap_random (N8.4), kern.consdev,
# kern.intrcnt, kern.evcount, kern.watchdog, kern.audio, hw.sensors, hw.ucomnames, hw.machine,
# hw.smt, hw.blockcpu (N7), kern.malloc, kern.pool, kern.pool_debug (N9); and the bounded
