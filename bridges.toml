#
# The bridges (docs/ZERO_UNSAFE.md section 0.3.2): every trait through which `hal` or
# `kernel` reaches code that has not moved into them yet. The trait is declared by the crate
# that calls it and held in a `OnceStatic<&'static dyn Trait>`; `bsd`'s `main()` registers an
# implementation over its legacy code before first use. A bridge carries no logic of its own.
# A trait a crate receives as a value (`hal::pmap::PhysPages`, `kernel::pipe::PipeGlue`) is a
# row only while `bsd` implements it; the row goes when a `kernel` module does, and the trait
# stays as API (decision 39). N9 requires this file to hold no row.
#
# Schema, one [[bridge]] per trait:
#   trait   = the trait's name, a bare identifier (its crate and module in the comment above the row)
#   for     = the files that call through it
#   paid_by = the milestone whose subsystem moves the implementation in and removes the row
#             ("N3".."N9"; a slice "N4.1" where one is meant)
# The comment above each row says what implements it today.

# bsd: the interrupt controller's part of spl(9) (struct arm_intr_func: raise, lower, x, setipl,
# and arm_splassert_check), implemented by sys/arch/arm64/arm64/intr.rs (ArmIntrHardware, over
# the table the GIC drivers give arm_set_intr_handler) and registered by arm64's initarm (N4.5c,
# replacing IntrLevel: the level itself is hal's). Decision 46: the C's function table as a
# trait. Paid when the GIC drivers move (N7).
# hal::intr::IntrHardware
[[bridge]]
trait = "IntrHardware"
for = ["sys/hal/intr.rs"]
paid_by = "N7"

# bsd: kern_fork.rs's thread_start (kernel::sched::trampoline_mi, which releases the hold the
# switch kept, then the function cpu_fork numbered in its table, thread_start_word): what a new
# thread's trampoline calls (N4.5a); a fn registered with hal::thread::register_start. Paid
# when fork1 and its function table move (N4.6).
# hal::thread::register_start
[[bridge]]
trait = "ThreadStart"
for = ["sys/hal/thread.rs"]
paid_by = "N4"


# bsd: pool_init/pool_get/pool_put, pr_nout, pool_sethiwat and pool_cache_init (RawPool's
# set_hiwat/cache_init, N3.4a: uvm_anon_init, amap_init) of sys/kern/subr_pool.rs, one pool per
# TypedPool so vmstat -m lists it; safe traits (PoolBackend, RawPool), the same boot contract.
# hal::pool::PoolBackend
[[bridge]]
trait = "PoolBackend"
for = ["sys/hal/pool.rs"]
paid_by = "N9"

# bsd: malloc/free with the C's malloc types (sys/kern/kern_malloc.rs), so vmstat -m counts an
# MBox in its type's row; a safe trait, the same boot contract.

# hal::malloc::Malloc
[[bridge]]
trait = "Malloc"
for = ["sys/hal/malloc.rs"]
paid_by = "N9"

# bsd: copyin, copyout, copyinstr, copyoutstr of sys/machine/copy.rs (copy.S with pcb_onfault).
# A safe trait: the user copies only read and write the byte slices they are given and user
# memory. N3.5 S0: kcopy_in/kcopy_out, kcopy onto a hal::user::ForeignWindow (uvm_io, kbind),
# through uiomove's UIO_SYSSPACE path (sys/kern/kern_subr.rs); hal calls them only inside a
# window the kernel map's token minted.
# hal::user::UserCopy
[[bridge]]
trait = "UserCopy"
for = ["sys/hal/user.rs"]
paid_by = "N4"

# bsd: cnputc, cngetc, cnpollc of sys/dev/cons.rs, registered once consinit() has run.
# hal::cons::Console
[[bridge]]
trait = "Console"
for = ["sys/hal/cons.rs"]
paid_by = "N7"

# bsd: printf of sys/kern/subr_prf.rs (the console and the message buffer, under printf's lock),
# implemented by sys/kern/hal_bridges.rs (BsdPrintf) and registered before main(); the kernel
# crate's lines (kernel::prf: unported!, vm::page, vm::pmemrange, vm::km) go through it.
# subr_prf goes with the bsd crate.
# hal::prf::Printf
[[bridge]]
trait = "Printf"
for = ["sys/hal/prf.rs"]
paid_by = "N9"

# bsd: the boot hand-over of abi_openbsd.ko (IMAGE_VA/IMAGE_LEN from stand::start_kernel),
# implemented by sys/kern/abi_module.rs. The trait keeps only image since N3.2: the mapping is
# the loader's own on both machines (hal::pmap::module_window/module_enter, N3.1 commits 6 and
# 7) and the writable copy's memory is the kernel's (kernel::vm::km::module_memory(), a
# hal::module::ModuleMemory passed to load as a value). N4.1, the boot entry.
# hal::module::ModulePlatform
[[bridge]]
trait = "ModulePlatform"
for = ["sys/hal/module/load.rs"]
paid_by = "N4"


# bsd: BUFPAGES_DEFICIT and BUFPAGES_INACT of sys/sys/mount.rs over bcstats (sys/kern/vfs_bio.rs),
# implemented by sys/kern/vm_bsd.rs (BsdBufCacheStats) and registered by its uvm_page_init;
# 0 before registration (their boot values). N5, with the buffer cache.
# kernel::vm::pmemrange::BufCacheStats
[[bridge]]
trait = "BufCacheStats"
for = ["sys/kernel/vm/pmemrange.rs"]
paid_by = "N5"

# bsd: getnanotime and the three pipe filterops (which find the pair through the knote's
# file); implemented by sys/kern/pipe_glue.rs (BsdPipeGlue), the pair's generic parameter, not
# a registered slot. N4.4: the klist is the kernel's, by value in each pipe
# (kernel::event::Klist, Own kind): Knote, knote, klist_insert, klist_remove and klist_free
# left the trait. N4.5b: the sigio registration is the kernel's too (kernel::sigio::SigioRef in
# each pipe): new, pgsigio, sigio_free, sigio_setown and sigio_getown left the trait, and the
# glue holds nothing per pipe. What stays goes with the clock (N4.8).
# kernel::pipe::PipeGlue
[[bridge]]
trait = "PipeGlue"
for = ["sys/kernel/pipe.rs"]
paid_by = "N4"

# bsd: uiomove over a Uio (sys/kern/kern_subr.rs; the Uio itself is kernel::uio's since
# N4.3, bsd's alias in sys/sys/uio.rs), passed down by the glue's fo_read/fo_write as
# &mut dyn UioMove; N3.5 S1: uio_rw (is_write) for uvm_io (kern.proc_args). N4.3: paid by
# N7, with the last UIO_SYSSPACE builder (uiomove's kernel-address leg copies to an
# address its builder vouched for, which no safe hal function may do; VFS, net, the
# drivers and crypto type theirs in their slices).
# kernel::uio::UioMove (re-exported by kernel::pipe)
[[bridge]]
trait = "UioMove"
for = ["sys/kernel/pipe.rs", "sys/kernel/vm/io.rs"]
paid_by = "N7"

# bsd: what a file is open on and the calls the descriptors make into the subsystems still in
# bsd (sys/kern/kern_descrip.rs, BsdFileGlue, the glue kernel::file and kernel::descrip are
# instantiated with: the objects (vnode, socket, pipe, kqueue), struct fileops, the vnode
# layer's VOP_ADVLOCK/VOP_PATHCONF/VISTTY and the positioned-I/O checks (N5), SS_DNS (N6),
# SIGPIPE (N4.5), the stall wait (N5), pledge's fcntl/flock/ioctl hooks (N8, the last),
# maxfiles and tablefull). N4.4: knote_fdclose, fdkq_free and the Knote/FdKq types left (kqueue
# is kernel::event's); a kqueue file's fileops and object (kqueue_file, kqueue_of) and a vnode
# file's revocation (vnode_revoked, N5) came.
# kernel::file::FileGlue
[[bridge]]
trait = "FileGlue"
for = ["sys/kernel/file.rs", "sys/kernel/descrip.rs", "sys/kernel/event.rs"]
paid_by = "N8"

# bsd: dopipe's descriptor work, falloc/fdinsert/fdrelease/closef under fdplock
# (sys/kern/kern_descrip.rs, sys/sys/filedesc.rs), implemented by sys/kern/pipe_glue.rs.
# kernel::pipe::PipeFiles
[[bridge]]
trait = "PipeFiles"
for = ["sys/kernel/pipe.rs"]
paid_by = "N4"

# bsd: CPU_INFO_FOREACH, cpu_is_running, ci_proc_pmap, ci_cflushsz, x86_fast_ipi with
# LAPIC_IPI_INVLPG/INVLRANGE/INVLTLB and wbinvd_on_all_cpus (sys/arch/amd64/amd64/{cpu,ipi}.rs),
# for amd64's TLB shootdown and cache flush, implemented by sys/kern/hal_bridges.rs
# (BsdTlbCpus); arm64 broadcasts tlbi and registers none.
# hal::pmap::TlbCpus
[[bridge]]
trait = "TlbCpus"
for = ["sys/hal/arch/amd64/pmap/tlb.rs", "sys/hal/arch/amd64/pmap/backend.rs"]
paid_by = "N4"

# bsd: arc4random (sys/dev/rnd.rs), for arm64's ASID allocator (pmap_find_asid's random pick)
# and, N3.5 S1, hal::random's arc4random/arc4random_uniform (the kernel map's randomisation),
# implemented by sys/kern/hal_bridges.rs (BsdRandom).
# hal::pmap::Random
[[bridge]]
trait = "Random"
for = ["sys/hal/arch/arm64/pmap/asid.rs", "sys/hal/random.rs"]
paid_by = "N7"

# kernel::thread::Kthread (bsd's BsdKthread over kern_kthread.rs: kthread_create, kthread_exit,
# sched_peg_curproc of the primary CPU; the deferred queue is kernel::thread's since N4.5a):
# re-dated to N4.6, with fork1 (decision 8 of N4.5).
[[bridge]]
trait = "Kthread"
for = ["sys/kernel/thread.rs", "sys/kernel/timeout.rs", "sys/kernel/task.rs"]
paid_by = "N4"

# bsd: nanouptime, getnanouptime and nanotime of sys/kern/kern_tc.rs (the last two N4.4,
# kqueue's sleep and EVFILT_TIMER's NOTE_ABSTIME), implemented by sys/kern/hal_bridges.rs
# (BsdUptime). N4.8, with kern_tc.
# kernel::clock::Uptime
[[bridge]]
trait = "Uptime"
for = ["sys/kernel/clock.rs", "sys/kernel/timeout.rs", "sys/kernel/event.rs"]
paid_by = "N4"

# bsd: NET_LOCK, NET_UNLOCK and rw_status(&netlock) == RW_WRITE (sys/net/if.rs), for the vnode
# pager's uvn_io, which lets go of the net lock a faulting process holds around the VOP (N3.4c);
# implemented by sys/kern/hal_bridges.rs (BsdNetLock) and registered by bsd's uvm_init (N3.4e);
# nobody holds it before registration. N6, with the network stack.
# hal::netlock::NetLock
[[bridge]]
trait = "NetLock"
for = ["sys/hal/netlock.rs", "sys/kernel/vm/vnode.rs"]
paid_by = "N6"

# bsd: getmicrouptime (sys/kern/kern_tc.rs, for the vnode pager's own ratecheck), rebooting and
# &rebooting (sys/kern/kern_xxx.rs); implemented by sys/kern/vm_bsd.rs (BsdSysInfo) and
# installed by bsd's uvm_init (N3.4e); (0, 0) and false before. N4, with kern_time and kern_xxx.
# kernel::vm::vnode::SysInfo
[[bridge]]
trait = "SysInfo"
for = ["sys/kernel/vm/vnode.rs", "sys/kernel/vm/map.rs"]
paid_by = "N4"

# bsd: struct vnode (v_uvm, v_type == VBLK, VTEXT, v_mount, vref, vrele, vget(LK_NOWAIT),
# vn_lock, VOP_UNLOCK, VOP_GETATTR, VOP_READ and VOP_WRITE over a UIO_SYSSPACE uio with
# curproc's credentials: sys/sys/vnode.rs, sys/kern/vfs_subr.rs, vfs_vnops.rs, vfs_vops.rs),
# implemented by bsd's Vnode (sys/kern/vm_bsd.rs since N3.5) and passed as &'static dyn VnodeOps to
# uvn_attach and the uvm_vnp_* functions (vnodes are never freed); kept by the Uvn. N5, with
# the vnode layer. N3.5 S1: mmap(2)'s v_type, iszerodev(v_rdev) and VOP_GETATTR's va_flags.
# kernel::vm::vnode::VnodeOps
[[bridge]]
trait = "VnodeOps"
for = ["sys/kernel/vm/vnode.rs", "sys/kernel/vm/mmap.rs"]
paid_by = "N5"


# bsd: curproc's facts as uvm asks them (pledge_protexec, the W^X exemption and ps_wxcounter,
# sigexit, trapsignal, ps_pid/p_tid/ps_comm/PROC_PC, ps_acflag, lim_cur, P_HASSIBLING,
# ps_strings/ps_sigcode/ps_timekeep, fd_getfile..FRELE of a vnode, ps_kbind_* under ps_mtx,
# ps_libcpin, p_ru's faults and maxrss, log(9)); implemented by sys/kern/vm_bsd.rs (N3.5 S1,
# registered by bsd's uvm_init at the flip), one bsd call each. N4, when Proc moves.
# kernel::vm::proc::VmProc
[[bridge]]
trait = "VmProc"
for = ["sys/kernel/vm/proc.rs", "sys/kernel/vm/map.rs", "sys/kernel/vm/mmap.rs", "sys/kernel/vm/unix.rs", "sys/kernel/vm/meter.rs"]
paid_by = "N4"

# bsd: CTL_VM's reach into kern_sysctl.rs (sysctl_rdint, sysctl_int, sysctl_rdstruct,
# sysctl_string, and sysctl_rdstruct of struct uvmexp through bsd's SysctlPlain byte view),
# kern_malloc's nkmempages, sched_bsd's averunnable and kern_proc's allproc (each thread's p_stat
# and whether it is its CPU's idle thread); implemented by sys/kern/vm_bsd.rs (N3.5 S1,
# registered by bsd's uvm_init at the flip), one bsd call each. N4, with kern_sysctl and proc.
# kernel::vm::meter::VmSysctl
[[bridge]]
trait = "VmSysctl"
for = ["sys/kernel/vm/meter.rs"]
paid_by = "N4"

# bsd: the console's half of the device switch that sendsyslog(2) writes through when no
# syslogd(8) socket is set (dosendsyslog's KERNEL_LOCK leg): cnwrite and its test `constty ||
# cn_devvp` (dev/cons.c), implemented by sys/kern/subr_log.rs (BsdTtyDevsw, over dev/cons.rs's
# cnwrite, constty and cn_devvp_set) and registered by bsd's initconsbuf (N4.7a). N4.7b adds the
# tty's legs (d_stop, d_tty, the pty master test) per its brief. Paid when the console and the
# device switch move (N7, decision 45's CharDevice).
# kernel::log::TtyDevsw
[[bridge]]
trait = "TtyDevsw"
for = ["sys/kernel/log.rs"]
paid_by = "N7"

# bsd: the members of bsd's subsystems a process, thread, group and session carry (sigacts,
# the descriptor tables, the kqueues, the timeouts, the unveil table, the klist and its mutex,
# the run-queue link), the tables' storage, and the hooks into kern_sig (pgsignal, prsignal),
# tty (a session's hang-up, a group's terminal) and kern_timeout (s_verauthto); implemented by
# sys/kern/proc_glue.rs (BsdProcGlue, N4.2), which kernel::proc receives as its type
# parameter. N4.4: the knote and kqueue list adapters (proc_glue_links!), with_curproc
# (bsd's reads hal::thread's curproc since N4.5a),
# pledge_fail (N4.7) and process_ref (filt_procattach's counted process); the klist store
# left (ps_klist is the kernel's). N4.5a: the scheduler's hooks (kernel::sched):
# cold and cold_yield, tuagg_add_runtime and
# exit_account (kern_resource), the clock interrupts' stop and start (kern_clockintr,
# spc_runtime), assertwaitok, smr_idle, spl0, the machine's idle cycle, cpu_unidle and
# need_resched, the CPU topology and pmap_resident_count; the scheduler's hal::sleep::Sleep is
# kernel::sched::KernelSleep (the Sleep row is gone, decision 39). N4.5b: the signals are
# kernel::sig's (sleep_signal_check is kernel::sched's, pgsignal and prsignal left the trait);
# their calls out: exit1 (kern_exit, N4.6), coredump (the file systems, N5), and the
# machine's sendsig, signotify, PROC_STACK and TCB_GET (N4.8), and initprocess's address.
# N4.7, when the descriptors and the terminal move.
# kernel::proc::ProcGlue
[[bridge]]
trait = "ProcGlue"
for = ["sys/kernel/proc.rs", "sys/kernel/event.rs", "sys/kernel/sched.rs", "sys/kernel/sig.rs"]
paid_by = "N4"
