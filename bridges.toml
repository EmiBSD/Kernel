# nfiles, ttycount, maxthread, somaxconn, sominconn, nosuidcoredump, fscale, splassert,
# maxlocksperuid, autoconf_serial, ncpu, ncpufound, diskcount) and physmem's variable. Each
# registration leaves with its subsystem; N9 the last. Decision 46: the C's sysctlfn dispatch
