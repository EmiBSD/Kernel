notes = "M4: cpu_info_full_primary (its static initialiser is cpu_info_primary_init), cpu_info_list, cpu_init_msrs (MSR_STAR/LSTAR/CSTAR/SFMASK as in C and EFER.SCE, which the C's locore0 sets at boot; patinit reported), cpu_enter_pages (the TSS stacks; pmap_enter_special is M6); identifycpu, cpu_match/cpu_attach, cpu_init, cpu_boot_secondary, cpu_hatch, the MDS/TSX/ucode work are M4-b to M6; M7b: struct cpu_softc, cpu_ca/cpu_cd (CD_COCOVM, no cpu_activate), cpu_match (name and MAXCPUS; the SEV-ES check only concerns units MAXCPUS already refuses), cpu_attach for CPU_ROLE_SP and CPU_ROLE_BP (ci_self, sc_info, ci_dev, the ids, ci_handled_intr_level, the CPUF_* flags, cpu_intr_init; BP: lapic_enable and lapic_calibrate_timer); identifycpu, cpu_fix_msrs, mem_range_attach, cpu_init, cpu_init_mwait and cpu_init_vmm reported, an AP is reported (no km_alloc'd cpu_info_full without MULTIPROCESSOR); M8: cpu_init (CR4_DEFAULT with OSFXSR/OSXMMEXCPT, fpu_cleandata from the initial control words through xrstor_user/fpusave; SMEP/SMAP/UMIP/PKE/PCIDE and the XSAVE setup reported: they need identifycpu), called from cpu_attach for SP/BP; TSC: cpuid_level, cpu_vendor (StaticCell, written by init_x86_64), cpu_id, cpu_ebxfeature, cpu_ecxfeature, cpu_feature, ecpu_ecxfeature; cpu_attach calls identifycpu (cpu_fix_msrs and mem_range_attach still reported); M11a (MULTIPROCESSOR): cpu_info[], mp_cpu_funcs (mp_cpu_start is BootMp::start, mptramp.S replaced-by-limine; mp_cpu_start_cleanup has no NVRAM byte), the AP's cpu_attach (km_alloc'd cpu_info_full, idle pcb, sched_init_cpu, ncpus, cpu_info_list), cpu_boot_secondary_processors, cpu_start_secondary, cpu_boot_secondary, cpu_hatch (cpu_hatch_entry does mptramp.S's cpu_spinup_finish), cpu_init's CPUF_RUNNING and TLB flush, wbinvd_on_all_cpus; feature qemu: x86_ipi_selftest after cpu_boot_secondary_processors; M11b: tsc_test_sync_bp (cpu_start_secondary; cpu_boot_secondary while cold) and tsc_test_sync_ap (cpu_hatch; cpu_init while cold) run as in C; feature qemu: a verdict line per AP after the test (tsc.c's tsc_report_verdict); still reported: cpu_ucode_apply, cpu_tsx_disable, cpu_fix_msrs, mem_range_attach, cpu_init_mwait, cpu_init_vmm, patinit; M13: ioapic_bsp_id set by the CPU_ROLE_BP attach (NIOAPIC > 0); M14 (A2): after a boot by boot(8) the C's mp_cpu_start (NVRAM_RESET_JUMP, the 40:67 warm reset vector written through the direct map, INIT, two STARTUP IPIs to MP_TRAMPOLINE) is the BootMp::start of mp_madt_cpus (the enabled LAPIC/x2APIC entries of the MADT, standing for acpimadt0), cpu_start_secondary maps and unmaps the trampoline pages, mp_cpu_start_cleanup restores NVRAM_RESET_RST, and the processor enters cpu_hatch from mptramp.S's cpu_spinup_finish; under Limine as before; M16e: cpu_mwait_size, cpu_mwait_states, cpu_idle_mwait_cycle and cpu_init_mwait (called from cpu_attach for SP and BP, as in C; nothing under QEMU's qemu64, which has no MONITOR); M16d: rdrand and rdrand_tmo (RDSEED, else RDRAND, XORed with the TSC, two enqueue_randomness every 10 ms; the sample is 0 where the C reads an uninitialised one)"

