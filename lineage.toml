notes = "M8: elf_check_header, elf_load_psection, elf_read_from (vn_rdwr, or a slice of the boot module image), elf_adjustpins, elf_read_pintable, elf_load_file (ld.so: namei, the loadmap, uvm_map_hint/uvm_map_mquery placement, the vmcmds, the entry, the ld.so pin table into ps_pin), exec_elf_makecmds (ET_EXEC and ET_DYN with uvm_map_pie, PT_INTERP, DT_TEXTREL, PT_OPENBSD_RANDOMIZE/MUTABLE/SYSCALLS, PT_GNU_RELRO, ETXTBSY, vn_marktext), exec_elf_fixup (BOGO_PC kbind and VM_MAP_PINSYSCALL_ONCE without ld.so, the auxiliary vector with AUX_hwcap/hwcap2 per machine::exec, AUX_openbsd_timekeep and AUX_openbsd_execpath), elf_os_pt_note_name (the C's padding loops check nothing, nor does the port), elf_os_pt_note, hwcap/hwcap2 (arm64's cpu_identify not ported: 0); not ported: coredump_elf and its helpers (kern_sig.c's coredump stops at vn_open); host tests over OpenBSD's static PIE init/ksh/echo/ls when target/userland exists; Wasabi Systems 4-clause block accepted at M2; M14: exec_elf_makecmds takes the exec switch's nameidata argument and ignores it"

