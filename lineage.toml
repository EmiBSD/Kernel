lz = ["sys/uvm/uvm_mmap.rs", "sys/uvm/uvm_unix.rs", "sys/uvm/uvm_glue.rs", "sys/uvm/uvm_meter.rs", "sys/uvm/uvm_init.rs", "sys/uvm/uvm_page.rs", "sys/uvm/uvm_vnode.rs", "sys/uvm/uvm_km.rs"]
status = "redesigned"
notes = "N3.5 S1 wrote it dead; N3.5 S2 (the flip, sys/uvm/ deleted) made it bsd's only file of the subsystem (forbid, 0 unsafe): BsdVmProc (VmProc over curproc) and BsdVmSysctl (VmSysctl: sysctl_rdint/int/rdstruct/string, struct uvmexp as UvmexpCopy::to_ne_bytes, nkmempages, averunnable, allproc), registered by uvm_init; the fifteen sysent adapters (sysargs -> kernel::vm::mmap/unix) and their Native entries (VM_ENTRIES = KernelApi::vm, mi_syscall on the same row); uvm_init in the C's order around kernel::vm::init's two steps; uvm_purge, uvm_exit, uvm_init_limits, uvmspace_exec's install of a new vmspace, fork1's share-or-copy, the u-area with the legacy pointer, uvm_sysctl with sysctl(2)'s arguments, VmUio (a uio as UioMove for uvm_io); from sys/uvm/uvm_page.rs: the segment policy and uvm_page_physload's lines, uvm_page_init with BsdBufCacheStats, uvm_pagealloc with (obj, anon), uvm_pagealloc_multi, uvm_shutdown, paddr_is_dma_reachable, uvm_page_physdump, uvm_pmr_print; from sys/uvm/uvm_vnode.rs: impl VnodeOps for Vnode, BsdSysInfo, uvn_attach and the uvm_vnp_* wrappers; from sys/uvm/uvm_km.rs: kp_dma*, km_alloc/km_free with the legacy pointer, vm_min_kernel_address; host tests: the km wrappers, a pinsyscalls table honoured by pin_check, CTL_VM through the kernel"

