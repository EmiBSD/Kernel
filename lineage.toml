[[module]]
rust = "sys/kernel/vm/vnode.rs"
crate = "kernel"
lz = ["sys/uvm/uvm_vnode.rs"]
status = "redesigned"
notes = "N3.4c: struct uvm_vnode as Uvn, a PoolArc of uvmvnodes leaked once made (PoolArc::leak: never freed, the vnode keeps it as the C), ObjRef::Vnode; the vnode a &'static dyn VnodeOps (bsd's Vnode at the flip, bridges.toml VnodeOps), uvn_io composed from one-call methods with the KernelLock, NetLock and SysInfo bridges (N5.0: SysInfo gone, the clock is kernel::tc's getmicrouptime and rebooting/&rebooting kernel::reboot's); u_flags/u_nio/u_size relaxed atomics whose setters assert the lock; uvn_wlist a hal List under the kernel lock, uvn_sync_q inside the Rwlocked uvnsync; uvn_get split into uvn_get_locked and uvn_get_sync; the pager window a PagerWindow; ratecheck's lasttime in a Mutexed (IPL_HIGH). Live since the flip (N3.4e, one commit with the fault): bsd keeps 0-unsafe adapters (uvm_anon VmAref, uvm_amap amap_copy's map half, uvm_vnode VnodeOps, uvm_fault FaultMap) and re-exports kernel::vm::{object, aobj, pager} under their uvm_* paths"
