notes = "BSD-4-clause (Wasabi), BSD-2-clause (NetBSD Foundation) and BSD-3-clause blocks. M14 (A2): the kernel's 32-bit entry from boot(8) (efiboot), ELF entry `start` (Limine enters _start through its entry point request): the boot arguments (boothowto, bootdev, esym, biosbasemem, bootapiver, bootinfo[]), the temporary #VC IDT, the CPUID probe (cpuid_level, cpu_vendor, cpu_id, cpu_*feature, pg_nx), the bootstrap tables after the kernel and its symbols (kernel image at KERNBASE, identity map, ISA I/O memory, the first 4 GB of the direct map with the kernel's 2 MB pages read-only, the recursive slot), PAE/LME/SCE/NXE, paging, the far jump to long mode and the higher half, the identity map dropped, ssym; then bootarg_main (sys/stand/bootarg.rs) instead of init_x86_64 + main. Deviations: AT&T through global_asm! (const/sym placeholders, .macro fillkpt, .if); no Meltdown probe (cpu_meltdown not ported, pg_g_kern stays 0) and no AMD SEV probe/GHCB (AMDSEV not configured; locore_vc_trap32 is its !AMDSEV termination request); no pmap_direct_rand; no proc0 stack in the tables (a 64 KiB .bss boot stack, proc0's u-area is PROC0_UAREA); atdevbase not relocated (the direct map's ISA hole)"

[[module]]
