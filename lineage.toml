status = "redesigned"
notes = "M2: init_x86_64 (message buffer, consinit, boot -d -> db_enter), boot (cold path; under feature qemu the key wait is the failure exit; resettodr/if_downall/uvm_shutdown/dumpsys/config_suspend_all/cpu_reset reported unported; M14: vfs_shutdown is called, as the C does), delay (the DELAY macro over delay_func), cpureset_delay, lid_action, waittime; M3: the direct map, pmap_bootstrap, the memory clusters, cpu_startup's memory lines; M4: setgate/unsetgate/setregion/set_mem_segment/set_sys_segment, idt (a static page) and idt_allocmap, cpu_init_idt, idt_vec_alloc/alloc_range/set/free, x86_64_proc0_tss_ldt_init (ltr/lldt only, proc0's pcb reported), splassert_check, the GDT/TSS/IDT setup and cpu_init_msrs first thing in init_x86_64, which ends as the C does (intr_default_setup, softintr_init, splraise(IPL_IPI), intr_enable), cpu_enter_pages from cpu_startup; the bootinfo parsing, the ACPI/MP tables, cpu_init, dumpsys, sendsig/setregs, sysctl are M5 to M6; M5: startclocks in cpu_startup (rtcinit reported, M7), initclock_func/startclock_func (StaticCells with setters), cpu_initclocks, cpu_startclock, need_resched (aston reported, M5-b); M5-b1: proc0paddr (a static u-area; the boot stack stays Limine's), x86_64_proc0_tss_ldt_init sets ci_curpcb, pcb_fsbase, pcb_kstack, md_regs and (a deviation, for cpu_switchto) pcb_cr3 = %cr3; M5-b2: proc0 gets a full u-area (PROC0_UAREA, proc0paddr), aston, clear_resched, cpu_unidle (UP), cpu_idle_cycle_hlt/cpu_idle_cycle (cpu_idle_cycle_fcn is a direct call until acpicpu); cold moved to sys/systm.rs; M6-b2: reset_segs, setregs (MDP_IRET, pcb_fsbase, the user trap frame; initialize_thread_xstate is M6-c); kern_sig.c: sendsig, sys_sigreturn (through machine::MachineSignal), copyoutfpu, initialize_thread_xstate (reported: fpu.c), signotify (aston; cpu_kick is MULTIPROCESSOR), setregs calls initialize_thread_xstate; without fpu.c fpu_save_len is the fxsave size, cpu_use_xsaves is false, fpusave/fpureset/fpu_cleandata/xrstor_user are reported, so a handler shares the interrupted code's FPU state; the bootinfo parsing, the ACPI/MP tables, cpu_init, dumpsys, sendsig/setregs, sysctl are M5 to M6; cpu_startup prints version (conf/vers.rs) since kern_sysctl.c; M5: startclocks in cpu_startup (rtcinit reported, M7), initclock_func/startclock_func (StaticCells with setters), cpu_initclocks, cpu_startclock, need_resched (aston reported, M5-b); M5-b1: proc0paddr (a static u-area; the boot stack stays Limine's), x86_64_proc0_tss_ldt_init sets ci_curpcb, pcb_fsbase, pcb_kstack, md_regs and (a deviation, for cpu_switchto) pcb_cr3 = %cr3; M5-b2: proc0 gets a full u-area (PROC0_UAREA, proc0paddr), aston, clear_resched, cpu_unidle (UP), cpu_idle_cycle_hlt/cpu_idle_cycle (cpu_idle_cycle_fcn is a direct call until acpicpu); cold moved to sys/systm.rs; M6-b2: reset_segs, setregs (MDP_IRET, pcb_fsbase, the user trap frame; initialize_thread_xstate is M6-c); vfs stage 2: cpu_startup calls bufinit after the memory lines, as the C does; M8: cpu_startup makes exec_map (uvm_km_suballoc of 16 * NCARGS, VM_MAP_PAGEABLE); M8: copyin32 (alignment check, then copyin) behind machine::copy; M8: fpuinit from init_x86_64; initialize_thread_xstate (the non-XSAVES branch), sendsig fpusave and sys_sigreturn fpureset/fpu_cleandata/xrstor_user are real; fpu_save_len is fpu.c's; TSC: delay_func (StaticCell<fn(i32)>, delay_is_i8254), amd64_delay_quality, delay_init, delay_fini, cpu_set_vendor; init_x86_64 does locore0.S's CPUID probe (cpuid_level, cpu_vendor, cpu_id, cpu_*feature with CPUID_NXE) before cpu_set_vendor; the meltdown and SEV probes are not there; M10a: cpu_startup makes phys_map (uvm_km_suballoc of VM_PHYS_SIZE, flags 0) and stores it in uvm_extern's PHYS_MAP, as it does exec_map; M11a: the MULTIPROCESSOR parts: cpu_kick (X86_IPI_NOP to another CPU; no mwait, cpu_init_mwait is not ported), cpu_unidle's IPI, need_resched's cpu_kick (ci_want_resched is atomic), signotify's cpu_kick(p->p_cpu), boot's x86_broadcast_ipi(X86_IPI_HALT); init_x86_64 keeps BootInfo::mp in cpu.rs's BOOT_MP for mainbus_attach and mp_cpu_start (the C reads the ACPI/MP tables during autoconfiguration); map_tramps' MP trampoline pages and the avail_start floor are replaced-by-limine; M13: cpu_sysctl (through machine::cpu::cpu_sysctl, called by sys_sysctl for CTL_MACHDEP) is ported: consdev, chr2blk, cpuvendor, kbdreset (sysctl_securelevel_int), allowaperture (the #else: 0, APERTURE not configured), tscfreq, vmmode (cpu_sev_guestmode stays 0: the SEV probe is not ported), cpuid, cpufeature and the sysctl_bounded_arr table (hibernatedelay, lidaction, pwraction, xcrypt, invarianttsc, retpoline); bios_sysctl is EOPNOTSUPP as the C answers without bootapiver BAPIV_VECTOR (Limine passes no boot arguments: BIOS_DEV/BIOS_DISKINFO/BIOS_CKSUMLEN unreachable); forceukbd (M16d, with pckbc(4): read-only once set, else sysctl_int and, when set, pckbc_release_console); amd64_has_xcrypt (identcpu.rs) stays 0 (via_nano_setup not ported) and need_retpoline (cpu.rs) stays 1 (no codepatch); kbd_reset and hibernate_delay are statics here; the CPU_* names and CTL_MACHDEP_NAMES are in include/cpu.rs; M14 (A2, the boot(8) entry): getbootinfo (the bootarg32 walk: BOOTARG_MEMMAP, DISKINFO (its record kept, bios_getdiskinfo not ported), APMINFO/PCIINFO ignored as in C, CKSUMLEN, CONSDEV (comcons* except comconsiot: consinit attaches in I/O space), BOOTMAC, DDB, BOOTDUID, BOOTSR (copied, then zeroed), EFIINFO, UCODE) behind machine::Cpu::getbootinfo, with init_x86_64's boot(8) half: the bootapiver and size checks, the EFI memory map relocated to first_avail, avail_start (MP trampolines), the bios_memmap flensing into a MemMap (the [IOM_END, KERNTEXTOFF) block only where boot(8) says free; memory above the 4 GB locore0 maps is reported, pmap_bootstrap's direct-map extension is not ported), pmap_direct_base without pmap_direct_rand; init_x86_64 calls pmap_prealloc_lowmem_ptps after a boot(8) boot; map_tramps (the MP half; the lo32 bounce page reported; nothing under Limine); the globals ssym, esym, bootdev, biosbasemem, bootapiver, bootinfo[], bootinfo_size, bios_cksumlen, bios_diskinfo, bios_efiinfo, bios_ucode, avail_start; the CPUs come from a MADT walk (cpu.rs mp_madt_cpus) since acpimadt.c is not ported; M13 (rasops): bios_efiinfo() (reads BIOS_EFIINFO, which getbootinfo fills after a boot(8) boot and init_x86_64 under Limine when the machine booted through UEFI): config_acpi, system_table and the fb_* fields from Limine's framebuffer response (masks from the channel sizes and shifts, the reserved mask the rest of the pixel), for efifb(4); M16e: bios_memmap kept as its record's place in bootinfo[] (BIOS_MEMMAP) with bios_memmap() over its entries; empty under Limine; M16e: cpu_idle_cycle_fcn and cpu_suspend_cycle_fcn (StaticCells written while cold), setperf_prio, cpu_idle_cycle through cpu_idle_cycle_fcn, cpu_kick and cpu_unidle with their mwait branches (cpu_mwait_size, MWAIT_IN_IDLE/KEEP_IDLING/ONLY); M16d: etext() (the linker script's etext, machine::Cpu::etext, for rnd.c's random_start)"

