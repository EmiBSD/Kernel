ache_cpus); counters other CPUs read are relaxed atomics with release/acquire on pc_gen; selftest=mpstress (selftest.rs) is the MP stress; N5.1, an exception to adapted (the user reviews it): adapted plus pool_get_idle, the RawPool::get_idle bridge method kernel's BoxPool needs (buf_get's try under the cache's lock: an item the pool holds, no growth, no sleep, no pr_nfail); moves with subr_pool's redesign"

