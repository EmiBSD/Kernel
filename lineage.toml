notes = "M16d: the whole file: the entropy input ring (rand_event, rnd_event_space, rnd_event_prod/cons, add_event_data, enqueue_randomness with the rnd_cold path and rnd_timeout), add_entropy_words (twisted GFSR, twist_table), dequeue_randomness, extract_entropy (SHA-512 of the pool copy), suspend_randomness/resume_randomness (no caller: subr_suspend.c not ported), the ChaCha20 generator (_rs_init, _rs_seed, _rs_stir, _rs_stir_if_needed, _rs_rekey, _rs_random_buf, _rs_random_u32 under rndlock IPL_HIGH), _rs_clearseed (km_alloc kv_any/kp_none at kd_prefer, pmap_kenter_pa), arc4random, arc4random_buf, arc4random_ctx_new/free/buf (malloc M_TEMP), arc4random_uniform, rnd_init, rnd_reinit (rnd_task on systq, rndreinit_timeout 10 min), random_start (__guard_local warning, clearseed, msgbuf and etext words, good-seed lines), randomopen/close/read/write/kqfilter/ioctl and the filtops (cdevsw 45), sys_getentropy. entropy_pool0 and rs_buf0 in .openbsd.randomdata (PT_OPENBSD_RANDOMIZE in both kernel.ld), read volatile. Deviations: the C's lock-free shared words are Relaxed atomics; add_entropy_words' two statics live in EntropyPool with the pool; extract_entropy hashes block by block; the generator state is a StaticCell under rndlock, which suspend/resume_randomness also take; _rs_clearseed panics on an unmapped seed page; arc4random_ctx_new returns None (callers ENOMEM) if malloc fails. Boot seed: boot(8)/efiboot fills the segment (loadrandom, mdrandom, fwrandom; RB_GOODRANDOM); Limine fills nothing (unported! in sys/stand/mod.rs; random_start prints the C's no-entropy warning). Licence BSD-3 with a GPL alternative, the BSD terms apply (block now verbatim from the pin); host tests (ChaCha keystream vector, rekey/fill, pool mixing, input ring, uniform bound)"

