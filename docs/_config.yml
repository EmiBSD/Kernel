title: EmiBSD
description: An operating system in Rust, grown from the faithful port of the OpenBSD kernel.
theme: jekyll-theme-midnight
logo: Ferffy.jpg
show_downloads: false

# Render every docs/*.md as /<NAME> (e.g. docs/ARCHITECTURE.md -> /ARCHITECTURE),
# which is what index.html links to. Markdown links between the docs
# (`[x](ROADMAP.md)`) are rewritten to .html by GitHub Pages' jekyll-relative-links.
permalink: /:basename

# CNAME (emibsd.org) is not excluded: Jekyll must copy it to the site.
exclude:
  - bench/
